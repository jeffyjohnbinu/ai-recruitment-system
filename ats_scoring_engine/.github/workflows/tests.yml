name: ATS Scoring Engine Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ats_scoring_engine/requirements.txt

      - name: Run automated test suite
        run: python ats_scoring_engine/tests/run_tests.py

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-scoring-engine-test-logs
          path: ats_scoring_engine/tests/logs/
