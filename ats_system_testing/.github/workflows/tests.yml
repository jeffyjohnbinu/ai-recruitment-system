name: ATS System Testing (Day 17)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest

      - name: Run automated test suite
        run: python ats_system_testing/tests/run_tests.py

      - name: Run full CLI (writes structured JSON result)
        run: python -m ats_system_testing.cli --output-dir ats_system_testing/tests/test_outputs

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-testing-logs
          path: ats_system_testing/tests/logs/

      - name: Upload structured test-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-testing-results
          path: ats_system_testing/tests/test_outputs/
