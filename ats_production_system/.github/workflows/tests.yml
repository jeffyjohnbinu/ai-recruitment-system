name: ATS Production System Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ats_production_system/requirements.txt

      - name: Run end-to-end integration test suite
        run: python ats_production_system/tests/run_tests.py

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-production-system-test-logs
          path: ats_production_system/tests/logs/

      - name: Upload pipeline run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-production-system-outputs
          path: ats_production_system/tests/test_outputs/
